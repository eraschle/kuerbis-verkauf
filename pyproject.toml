[project]
name = "kuerbis"
version = "0.1.0"
description = "Erfassung und Auswertung des Hofkürbisverkaufs"
authors = [
    { name = "Erich Raschle", email = "erichraschle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pywebview>=6.2.1",
]

[project.scripts]
kuerbis = "kuerbis.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
